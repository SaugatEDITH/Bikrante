{% extends "shopapp/base.html" %}
{% load static %}
{% block extracss %}
<link rel="stylesheet" href="{% static 'css/payment-button.css' %}">

{% endblock extracss %}
{% block content %}
<!-- ham -->
<div id="main">
    <center>
    <h2>Are you Sure Want to Proceed?</h2>
    <h4>Mr/Mrs. {{user}}</h4>
    <form id="esewa-form" method="POST" action="https://rc-epay.esewa.com.np/api/epay/main/v2/form">
        <input type="hidden" id="amount" name="amount" value="{{total_amount}}" required>
        <input type="hidden" id="tax_amount" name="tax_amount" value="0" required>
        <input type="hidden" id="total_amount" name="total_amount" value="{{total_amount}}" required>
        <!--dynamic uuid-->
        <input type="hidden" id="transaction_uuid" name="transaction_uuid" value="{{uid}}" required>
        <input type="hidden" id="product_code" name="product_code" value="EPAYTEST" required>
        <input type="hidden" id="product_service_charge" name="product_service_charge" value="0" required>
        <input type="hidden" id="product_delivery_charge" name="product_delivery_charge" value="0   " required>
        <input type="hidden" id="success_url" name="success_url" value="{{ success_url }}" required>
        <input type="hidden" id="failure_url" name="failure_url" value="http://localhost:8000/" required>
        <input type="hidden" id="signed_field_names" name="signed_field_names"
            value="total_amount,transaction_uuid,product_code" required>
        <input type="hidden" id="signature" name="signature" value="{{signature}}" required>
        {% comment %} <input value="Submit" type="submit" class="buttonconfirm"> {% endcomment %}
        <a class="playbtn" href="#" onclick="submitForm(event)">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            Proceed Payment
          </a>
    </form>
    <script>
        function submitForm(event) {
          event.preventDefault(); // Prevent default anchor action
          document.getElementById("esewa-form").submit(); // Submit the form
        }
      </script>
    <center>
</div>

{% endblock content %}
