{% extends "shopapp/base.html" %}
{% block content %}
<main class="main">
  <section class="login-register section--lg">
    <div class="login-register__container container">
      <div class="login" style="max-width: 500px; margin: 0 auto;">
        <h3 class="section__title">Forgot Password</h3>
        {% if message %}
          {% for msg in message %}
            <div class="alert" style="color: red; margin-bottom: 10px;">{{ msg }}</div>
          {% endfor %}
        {% endif %}
        <form class="form grid" method="POST">
          {% csrf_token %}
          <input
            type="email"
            placeholder="Enter your email"
            class="form__input"
            name="email"
            required
          />
          <div class="form__btn">
            <button type="submit" class="btn">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
{% endblock content %}
