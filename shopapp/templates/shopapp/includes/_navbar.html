{% load static %}
<header class="header">
    <nav class="nav container">
      <a href="{% url 'home' %}" class="nav__logo">
        <img
          class="nav__logo-img"
          src="{% static 'images/logo.svg' %}"
          alt="website logo"
          style="width: 150px; height: 150px;"
        />
      </a>
     
      <div class="nav__menu" id="nav-menu">
        <div class="nav__menu-top">
          <a href="{% url 'home' %}" class="nav__menu-logo" style="color:black;background:yellow;">
            <img src=" {% static 'images/logo.svg' %}" alt="">
          </a>
          <div class="nav__close" id="nav-close">
            <i class="fi fi-rs-cross-small"></i>
          </div>
        </div>
        <ul class="nav__list">
          <li class="nav__item">
            <a href="{% url 'home' %}" class="nav__link {% if request.resolver_match.url_name == 'home' %}active-link{% endif %}">
              <i class="fas fa-home"></i> Home 
            </a>
          </li>
          <li class="nav__item">
            <a href="{% url 'shop' %}" class="nav__link {% if request.resolver_match.url_name == 'shop' %}active-link{% endif %}">
              <i class="fas fa-store"></i> Shop 
            </a>
          </li>
          <li class="nav__item">
            <a href="{% url 'contact' %}" class="nav__link {% if request.resolver_match.url_name == 'contact' %}active-link{% endif %}">
              <i class="fas fa-envelope"></i> Contact 
            </a>
          </li>
          {% if user.is_authenticated %}
          <li class="nav__item">
            <a href="{% url "user-dashboard" %}" class="nav__link">
              <i class="fas fa-user"></i>My Account 
            </a>
          </li>
          <li class="nav__item">
            <a href="{% url 'logout' %}" class="nav__link">
              <i class="fas fa-sign-out-alt"></i> Logout 
            </a>
          </li>
          {% else %}
          <li class="nav__item">
            <a href="{% url 'login' %}" class="nav__link {% if request.resolver_match.url_name == 'login' %}active-link{% endif %}">
              <i class="fas fa-sign-in-alt"></i> Login 
            </a>
          </li>
          <li class="nav__item">
            <a href="{% url 'signup' %}?next={{ 'profile-onboarding'|urlencode }}" class="nav__link {% if request.resolver_match.url_name == 'signup' %}active-link{% endif %}">
                <i class="fas fa-user-plus"></i> Signup 
            </a>
          </li>
          {% endif %}
        </ul>
        <div class="header__search">
          <form class="search-form" action="{% url "search" %}"
                hx-get="{% url 'search' %}"
                hx-trigger="submit, input changed delay:300ms, change"
                hx-target="#main-content"
                hx-swap="innerHTML">
            <div class="search-input-wrapper">
              <button type="button" class="filter__btn" onclick="toggleFilter()">
                <i class="fas fa-filter"></i>
              </button>
              <input
                type="text"
                placeholder="Search For Items..."
                class="form__input"
                name="search_text"
                autocomplete="off"
                value="{{ request.GET.search_text|default:'' }}"
              />
              <button type="submit" class="search__btn">
                <img src="{% static 'images/search.png' %}" alt="search icon" class="search-indicator" />
              </button>
              <div id="filterDropdown" class="filter-content">
                <div class="filter-group">
                  <label><i class="fas fa-tags"></i> Price Range:</label>
                  <div style="display: flex; gap: 8px;">
                    <input type="number" placeholder="Min" name="min_price" value="{{ request.GET.min_price|default:'' }}">
                    <input type="number" placeholder="Max" name="max_price" value="{{ request.GET.max_price|default:'' }}">
                  </div>
                </div>
                <div class="filter-group">
                  <label><i class="fas fa-sort-amount-down"></i> Sort By:</label>
                  <select name="sort">
                    <option value="" {% if request.GET.sort == '' or not request.GET.sort %}selected{% endif %}>Default</option>
                    <option value="price_asc" {% if request.GET.sort == 'price_asc' %}selected{% endif %}>Price: Low to High</option>
                    <option value="price_desc" {% if request.GET.sort == 'price_desc' %}selected{% endif %}>Price: High to Low</option>
                  </select>
                </div>
                <button type="submit" class="filter-apply">Apply Filters</button>
              </div>
            </div>
          </form>
          <script>
            function toggleFilter() {
              const dropdown = document.getElementById('filterDropdown');
              dropdown.classList.toggle('show');
            }
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
              const dropdown = document.getElementById('filterDropdown');
              const filterBtn = document.querySelector('.filter__btn');

              if (!dropdown || !filterBtn) return;

              // Check if click is outside both the dropdown and filter button
              if (!dropdown.contains(event.target) && !filterBtn.contains(event.target)) {
                dropdown.classList.remove('show');
              }
            });
          </script>
        </div>
      </div>
      <div class="header__user-actions">
        <a href="{% url 'wishlist' %}" class="header__action-btn" title="Wishlist">
          <img src="{% static "images/icon-heart.svg" %} " alt="" />
          <span class="count" id="nav-wishlist-count" hx-swap-oob="true">
            {{ user.liked_products.count|default:"0" }}
          </span>
        </a>
        <a href="{% url 'cart' %}" class="header__action-btn" title="Cart">
          <img src="{% static 'images/icon-cart.svg' %}" alt="" />
          <span class="count" id="nav-cart-count" hx-swap-oob="true" >
            {{ user.cart_items.count | default:"0" }}
          </span>
        </a>
        <div class="header__action-btn nav__toggle" id="nav-toggle">
          <img src="{% static 'images/menu-burger.svg' %}" alt="">
        </div>
      </div>
    </nav>
  </header>
