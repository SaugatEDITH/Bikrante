{% extends "shopapp/base.html" %}
{% block content %}
<main class="main">
  <section class="login-register section--lg">
    <div class="login-register__container container">
      <div class="login" style="max-width: 500px; margin: 0 auto;">
        <h3 class="section__title">Reset Password</h3>
        {% if message %}
          {% for msg in message %}
            <div class="alert" style="color: red; margin-bottom: 10px;">{{ msg }}</div>
          {% endfor %}
        {% endif %}
        {% if user %}
        <form class="form grid" method="POST">
          {% csrf_token %}
          <input
            type="password"
            placeholder="New Password"
            class="form__input"
            name="password"
            required
          />
          <input
            type="password"
            placeholder="Confirm New Password"
            class="form__input"
            name="cpassword"
            required
          />
          <div class="form__btn">
            <button type="submit" class="btn">Reset Password</button>
          </div>
        </form>
        {% else %}
        <div class="alert" style="color: red;">Invalid or expired reset link.</div>
        {% endif %}
      </div>
    </div>
  </section>
</main>
{% endblock content %}
